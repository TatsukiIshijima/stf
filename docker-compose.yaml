volumes:
  rethinkdb: { }
  storage-temp: { }

services:

  nginx:
    image: nginx:1.27.4
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
      - auth
      - storage-plugin-apk
      - storage-plugin-image
      - storage-temp
      - websocket
      - api

  rethinkdb:
    image: rethinkdb:2.4.2
    restart: unless-stopped
    volumes:
      - rethinkdb:/data

  app:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - RETHINKDB_PORT_28015_TCP
      - SECRET
    command: >
      stf app
        --auth-url http://${PUBLIC_IP}/auth/mock/
        --websocket-url ws://${PUBLIC_IP}/
        --port 3100
    depends_on:
      - rethinkdb
      - auth
      - websocket

  auth:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - RETHINKDB_PORT_28015_TCP
      - SECRET
    command: >
      stf auth-mock
        --app-url http://${PUBLIC_IP}/
        --port 3200
    depends_on:
      - rethinkdb

  processor:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - RETHINKDB_PORT_28015_TCP
    command: >
      stf processor
        --connect-app-dealer tcp://app-triproxy:7160
        --connect-dev-dealer tcp://dev-triproxy:7260
    depends_on:
      - rethinkdb
      - app-triproxy
      - dev-triproxy

  app-triproxy:
    image: devicefarmer/stf
    restart: unless-stopped
    command: >
      stf triproxy app
        --bind-pub "tcp://*:7150"
        --bind-dealer "tcp://*:7160"
        --bind-pull "tcp://*:7170"

  dev-triproxy:
    image: devicefarmer/stf
    restart: unless-stopped
    command: >
      stf triproxy dev
        --bind-pub "tcp://*:7250"
        --bind-dealer "tcp://*:7260"
        --bind-pull "tcp://*:7270"

  migrate:
    image: devicefarmer/stf
    environment:
      - RETHINKDB_PORT_28015_TCP
    command: stf migrate
    depends_on:
      - rethinkdb

  provider:
    image: devicefarmer/stf
    restart: unless-stopped
    # ADBはホストマシンのものを使用するため、host.docker.internalを指定
    command: >
      stf provider
        --name provider
        --connect-sub tcp://dev-triproxy:7250
        --connect-push tcp://dev-triproxy:7270
        --storage-url http://${PUBLIC_IP}/
        --public-ip ${PUBLIC_IP}
        --heartbeat-interval 10000
        --screen-ws-url-pattern "ws://${PUBLIC_IP}/d/nuc/<%= serial %>/<%= publicPort %>/"
        --adb-host host.docker.internal
        --min-port 7400
        --max-port 7410
        --allow-remote
    ports:
      - "7400-7410:7400-7410"
    depends_on:
      - dev-triproxy
      - app-triproxy
      - storage-temp

  reaper:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - RETHINKDB_PORT_28015_TCP
    depends_on:
      - migrate
      - rethinkdb
      - dev-triproxy
      - app-triproxy
    command: >
      stf reaper dev
        --connect-push tcp://dev-triproxy:7270
        --connect-sub tcp://app-triproxy:7150
        --heartbeat-timeout 30000

  storage-plugin-apk:
    image: devicefarmer/stf
    restart: unless-stopped
    command: >
      stf storage-plugin-apk
        --port 3300
        --storage-url http://${PUBLIC_IP}/
    depends_on:
      - storage-temp

  storage-plugin-image:
    image: devicefarmer/stf
    restart: unless-stopped
    command: >
      stf storage-plugin-image
        --port 3400
        --storage-url http://${PUBLIC_IP}/
    depends_on:
      - storage-temp

  storage-temp:
    build:
      context: .
      dockerfile: Dockerfile-storage-temp
    restart: unless-stopped
    volumes:
      - storage-temp:/app/data
    command: >
      stf storage-temp
        --port 3500
        --save-dir /app/data

  websocket:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - SECRET
      - RETHINKDB_PORT_28015_TCP
    command: >
      stf websocket
        --port 3600
        --storage-url http://${PUBLIC_IP}/
        --connect-sub tcp://app-triproxy:7150
        --connect-push tcp://app-triproxy:7170
    depends_on:
      - migrate
      - rethinkdb
      - storage-temp
      - app-triproxy
      - dev-triproxy

  api:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - SECRET
      - RETHINKDB_PORT_28015_TCP
    command: >
      stf api
        --port 3700
        --connect-sub tcp://app-triproxy:7150
        --connect-push tcp://app-triproxy:7170
        --connect-sub-dev tcp://dev-triproxy:7250
        --connect-push-dev tcp://dev-triproxy:7270
    depends_on:
      - migrate
      - rethinkdb
      - app-triproxy

  groups-engin:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - SECRET
      - RETHINKDB_PORT_28015_TCP
    command: >
      stf groups-engine
        --connect-push tcp://app-triproxy:7170
        --connect-sub tcp://app-triproxy:7150
        --connect-push-dev tcp://dev-triproxy:7270
        --connect-sub-dev tcp://dev-triproxy:7250
    depends_on:
      - migrate
      - rethinkdb
