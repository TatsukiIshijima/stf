volumes:
  rethinkdb-data: { }
  storage-temp-data: { }

services:

  nginx:
    image: nginx:1.27.4
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    ports:
      - "7100:80"
    depends_on:
      - app
      - auth
      - storage-plugin-apk
      - storage-plugin-image
      - storage-temp
      - websocket
      - api

  rethinkdb:
    image: rethinkdb:2.4.2
    restart: unless-stopped
    volumes:
      - rethinkdb-data:/data

  app-triproxy:
    image: devicefarmer/stf
    restart: unless-stopped
    command: >
      stf triproxy app001
        --bind-pub "tcp://*:7111"
        --bind-dealer "tcp://*:7112"
        --bind-pull "tcp://*:7113"

  dev-triproxy:
    image: devicefarmer/stf
    restart: unless-stopped
    command: >
      stf triproxy dev001
        --bind-pub "tcp://*:7114"
        --bind-dealer "tcp://*:7115"
        --bind-pull "tcp://*:7116"

  processor:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - RETHINKDB_PORT_28015_TCP
    command: >
      stf processor proc001
        --connect-app-dealer tcp://app-triproxy:7112
        --connect-dev-dealer tcp://dev-triproxy:7115
    depends_on:
      - rethinkdb
      - app-triproxy
      - dev-triproxy

  reaper:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - RETHINKDB_PORT_28015_TCP
    depends_on:
      - migrate
      - rethinkdb
      - dev-triproxy
      - app-triproxy
    command: >
      stf reaper repear001
        --connect-push tcp://dev-triproxy:7116
        --connect-sub tcp://app-triproxy:7111

  provider:
    image: devicefarmer/stf
    restart: unless-stopped
    # ADBはホストマシンのものを使用するため、host.docker.internalを指定
    command: >
      stf provider
        --name provider
        --min-port 7400
        --max-port 7410
        --connect-sub tcp://dev-triproxy:7114
        --connect-push tcp://dev-triproxy:7116
        --group-timeout 900
        --public-ip ${PUBLIC_IP}
        --storage-url http://${PUBLIC_IP}:7100/
        --adb-host host.docker.internal
        --adb-port 5037
        --vnc-initial-size 600x800
        --mute-master never
        --screen-ws-url-pattern "ws://${PUBLIC_IP}:7100"
        --cleanup-folder
    ports:
      - "7400-7410:7400-7410"
    depends_on:
      - dev-triproxy
      - app-triproxy
      - storage-temp

  auth:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - RETHINKDB_PORT_28015_TCP
      - SECRET
    command: >
      stf auth-mock
        --app-url http://${PUBLIC_IP}:7100/
        --port 7120
    depends_on:
      - rethinkdb

  app:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - RETHINKDB_PORT_28015_TCP
      - SECRET
    command: >
      stf app
        --auth-url http://${PUBLIC_IP}:7100/auth/mock/
        --websocket-url http://${PUBLIC_IP}:7110/
        --port 7105
    depends_on:
      - rethinkdb
      - auth
      - websocket

  api:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - SECRET
      - RETHINKDB_PORT_28015_TCP
    command: >
      stf api
        --port 7106
        --connect-sub tcp://app-triproxy:7111
        --connect-push tcp://app-triproxy:7113
        --connect-sub-dev tcp://dev-triproxy:7114
        --connect-push-dev tcp://dev-triproxy:7116
    depends_on:
      - migrate
      - rethinkdb
      - app-triproxy

  groups-engin:
    image: devicefarmer/stf
    restart: unless-stopped
    environment:
      - SECRET
      - RETHINKDB_PORT_28015_TCP
    command: >
      stf groups-engine
        --connect-push tcp://app-triproxy:7113
        --connect-sub tcp://app-triproxy:71111
        --connect-push-dev tcp://dev-triproxy:7116
        --connect-sub-dev tcp://dev-triproxy:7114
    depends_on:
      - migrate
      - rethinkdb

  websocket:
    image: devicefarmer/stf
    restart: unless-stopped
    ports:
      - "7110:7110"
    environment:
      - SECRET
      - RETHINKDB_PORT_28015_TCP
    command: >
      stf websocket
        --port 7110
        --storage-url http://${PUBLIC_IP}:7100/
        --connect-sub tcp://app-triproxy:7111
        --connect-push tcp://app-triproxy:7113
    depends_on:
      - migrate
      - rethinkdb
      - storage-temp
      - app-triproxy
      - dev-triproxy

  storage-temp:
    build:
      context: .
      dockerfile: Dockerfile-storage-temp
    restart: unless-stopped
    volumes:
      - storage-temp-data:/app/data
    command: >
      stf storage-temp
        --port 7102
        --save-dir /app/data


  storage-plugin-image:
    image: devicefarmer/stf
    restart: unless-stopped
    command: >
      stf storage-plugin-image
        --port 7103
        --storage-url http://${PUBLIC_IP}:7100/
    depends_on:
      - storage-temp

  storage-plugin-apk:
    image: devicefarmer/stf
    restart: unless-stopped
    command: >
      stf storage-plugin-apk
        --port 7104
        --storage-url http://${PUBLIC_IP}:7100/
    depends_on:
      - storage-temp

  migrate:
    image: devicefarmer/stf
    environment:
      - RETHINKDB_PORT_28015_TCP
    command: stf migrate
    depends_on:
      - rethinkdb
